services:
  - type: web
    name: silelo-neo-connect
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OLLAMA_URL
        sync: false
      - key: RUN_SECRET
        sync: false
      - key: NEO_CONNECT_API_KEY
        sync: false
      - key: MANUS_API_KEY
        sync: false
      - key: CONNECTOR_GATEWAY_URL
        sync: false
      - key: CONNECTOR_GATEWAY_TOKEN
        sync: false
      - key: CONNECTOR_GATEWAY_TIMEOUT_MS
        value: "15000"
      - key: APP_URL
        value: https://silelo-neo-connect.onrender.com
      - key: POLLINATIONS_MODEL
        value: openai
