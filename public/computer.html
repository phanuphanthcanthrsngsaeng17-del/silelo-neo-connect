<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SILELO Computer 2569</title><link rel="stylesheet" href="/computer.css"></head><body><main class="computer"><header><div><h1>🖥 SILELO Computer 2569</h1><p id="status">พร้อมตรวจสอบ browser engine จริง</p></div><a href="/chat">กลับแชท</a></header><section class="toolbar"><input id="url" type="url" placeholder="https://example.com"><button id="open">เปิดเว็บจริง</button><button id="read">อ่านหน้า</button><button id="shot">ถ่ายภาพหน้าจอ</button><button id="stop" class="danger">หยุด</button></section><section class="action"><input id="selector" placeholder="CSS selector เช่น button[type=submit]"><input id="value" placeholder="ข้อความสำหรับกรอก"><button id="click">คลิก (ยืนยัน)</button><button id="type">กรอก (ยืนยัน)</button></section><div class="grid"><section><h2>ภาพหน้าจอจริง</h2><div class="screen"><img id="screen" alt="ภาพหน้าจอจาก Chromium" hidden><span id="empty">ยังไม่มีภาพหน้าจอ</span></div></section><section><h2>ข้อมูลหน้าเว็บ</h2><pre id="output">Computer จะแสดงผลที่นี่</pre><h2>Action log</h2><div id="log" class="log"></div></section></div><p class="warning">การคลิกและกรอกข้อมูลต้องยืนยันทุกครั้ง ระบบจำกัดเฉพาะเจ้าของและไม่รองรับการส่งข้อมูลลับโดยอัตโนมัติ</p></main><script src="/computer.js"></script></body></html>
