<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SILELO AI Agent Builder — Live</title><style>body{margin:0;background:#080d18;color:#eef4ff;font:15px system-ui;padding:24px}main{max-width:900px;margin:auto}.card{background:#10192a;border:1px solid #293957;border-radius:16px;padding:18px;margin:12px 0}label{display:block;color:#9db0cf;margin:12px 0 6px}input,textarea,select{width:100%;box-sizing:border-box;background:#09111f;color:#fff;border:1px solid #334463;border-radius:9px;padding:10px}textarea{min-height:100px}button{background:#8b7cf7;color:#fff;border:0;border-radius:9px;padding:10px 14px;margin:8px 6px 0 0;font-weight:700}pre{white-space:pre-wrap;background:#070b13;border-radius:10px;padding:14px;min-height:120px}.ok{color:#22c55e}.err{color:#fb7185}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main><h1>🧩 SILELO AI Agent Builder</h1><p>Live Runtime • เชื่อม API ของ SILELO โดยตรง</p><div class="card"><div class="row"><div><label>ชื่อ Agent</label><input id="name" value="SILELO Assistant"></div><div><label>Model mode</label><select id="mode"><option value="understand">Understand</option><option value="execute">Execute</option></select></div></div><label>System Prompt</label><textarea id="prompt">คุณคือ SILELO AI Agent ช่วยผู้ใช้ด้วยภาษาไทยสุภาพ และเลือกเครื่องมือที่เหมาะสมตามสิทธิ์ที่ระบบอนุญาต</textarea><label>ข้อความทดสอบ</label><textarea id="input">ช่วยวางแผนงานให้ฉันหน่อย</textarea><button onclick="run()">▶ ส่งเข้า Agent Runtime</button><button onclick="skills()">🔎 ตรวจ Skills</button><button onclick="save()">💾 บันทึก</button></div><div class="card"><h3>Runtime Result</h3><pre id="out">ยังไม่มีการทดสอบ</pre></div></main><script>const $=id=>document.getElementById(id);function cfg(){return{name:$('name').value,prompt:$('prompt').value,mode:$('mode').value,input:$('input').value}}function save(){localStorage.setItem('silelo-agent-live',JSON.stringify(cfg()));$('out').textContent='✓ บันทึก Agent configuration แล้ว'}async function run(){const c=cfg();$('out').textContent='กำลังส่งคำขอ...';try{const r=await fetch('/api/intent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:c.input,mode:c.mode})});const j=await r.json();if(!r.ok)throw new Error(j.error||'HTTP '+r.status);$('out').textContent=JSON.stringify({agent:c.name,mode:c.mode,runtime:j},null,2)}catch(e){$('out').textContent='ERROR: '+e.message}}async function skills(){const q=encodeURIComponent($('input').value);$('out').textContent='กำลังค้น skills...';try{const r=await fetch('/api/intent-skills?q='+q+'&mode='+$('mode').value);const j=await r.json();if(!r.ok)throw new Error(j.error||'HTTP '+r.status);$('out').textContent=JSON.stringify(j,null,2)}catch(e){$('out').textContent='ERROR: '+e.message}}(()=>{try{const x=localStorage.getItem('silelo-agent-live');if(x){const c=JSON.parse(x);$('name').value=c.name||$('name').value;$('prompt').value=c.prompt||$('prompt').value;$('mode').value=c.mode||'understand';$('input').value=c.input||$('input').value}}catch(e){}})();</script></body></html>
