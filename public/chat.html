<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SILELO Neo-Connect — แชท</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #01030a; --cyan: #00e5ff; --purple: #a78bfa; --amber: #ffb74d; --pink: #ff2d95;
    --txt: #e8f6ff; --dim: #6b7f99;
    --accent: var(--cyan);
    --bot-grad1: rgba(167,139,250,.24); --bot-grad2: rgba(167,139,250,.08);
    --bot-border: rgba(167,139,250,.45);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--txt); height: 100%; overflow: hidden; overflow-x: hidden;
    font-family: 'Prompt', 'Segoe UI', sans-serif;
  }
  .bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .aurora { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .4; animation: drift 16s ease-in-out infinite alternate; }
  .aurora.a1 { width: 50vw; height: 50vw; left: -20vw; top: -20vw; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 25%, transparent), transparent 65%); }
  .aurora.a2 { width: 44vw; height: 44vw; right: -16vw; bottom: -18vw; background: radial-gradient(circle, rgba(167,139,250,.18), transparent 65%); animation-delay: -7s; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(5vw,-4vh) scale(1.12); } }
  .scanlines { position: absolute; inset: 0; opacity: .06; background: repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 3px); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 100% 90% at 50% 35%, transparent 50%, rgba(0,0,0,.6)); }
  #particles { position: fixed; inset: 0; z-index: 0; opacity: .55; pointer-events: none; }

  .app { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; max-width: 880px; margin: 0 auto; width: 100%; overflow-x: clip; }

  /* ===== Header ===== */
  header {
    display: flex; align-items: center; gap: 14px; padding: 12px 16px;
    background: linear-gradient(180deg, rgba(8,16,36,.85), rgba(5,10,26,.6));
    backdrop-filter: blur(20px);
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    box-shadow: 0 0 34px color-mix(in srgb, var(--accent) 12%, transparent);
    position: relative;
  }
  header::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: .7; }
  .back-btn {
    width: 42px; height: 42px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    background: rgba(0,229,255,.06); color: var(--txt); font-size: 18px; cursor: pointer; flex: none;
    font-family: 'Orbitron', monospace; transition: all .2s;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  .back-btn:active { transform: scale(.9); background: color-mix(in srgb, var(--accent) 25%, transparent); box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 40%, transparent); }

  .avatar-wrap { position: relative; width: 52px; height: 52px; flex: none; }
  .avatar-wrap .ring {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 35%, var(--accent) 50%, transparent 65%);
    -webkit-mask: radial-gradient(circle, transparent 60%, #000 63%);
    mask: radial-gradient(circle, transparent 60%, #000 63%);
    animation: spin 3s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .avatar {
    position: absolute; inset: 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    background: radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--accent) 28%, transparent), rgba(3,6,18,.9));
    border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 35%, transparent), inset 0 0 12px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .hinfo { flex: 1; min-width: 0; }
  .hinfo h1 { font-family: 'Orbitron', sans-serif; font-size: 17px; letter-spacing: 3px; font-weight: 700; }
  .hinfo .status { font-size: 11px; color: var(--dim); display: flex; align-items: center; gap: 7px; font-family: 'Orbitron', monospace; letter-spacing: 1px; }
  .hinfo .status .pulse { width: 7px; height: 7px; border-radius: 50%; background: #22e584; box-shadow: 0 0 9px #22e584; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }

  .hbtns { display: flex; gap: 8px; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    background: rgba(0,229,255,.05); color: var(--txt); font-size: 16px; cursor: pointer; flex: none;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    transition: all .2s;
  }
  .icon-btn:active { transform: scale(.88); background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 35%, transparent); }

  /* ===== Messages ===== */
  #msgs { flex: 1; overflow-y: auto; padding: 20px 16px 8px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
  .msg { max-width: 82%; display: flex; flex-direction: column; animation: pop .28s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.96); } }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }

  .bubble {
    position: relative; padding: 13px 17px; font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
    font-weight: 300; backdrop-filter: blur(10px);
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, rgba(0,229,255,.28), rgba(0,140,255,.12));
    border: 1px solid rgba(0,229,255,.4);
    clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%, 0 12px);
    box-shadow: 0 0 22px rgba(0,229,255,.14), inset 0 0 20px rgba(0,229,255,.06);
  }
  .msg.bot .bubble {
    background: linear-gradient(135deg, var(--bot-grad1), var(--bot-grad2));
    border: 1px solid var(--bot-border);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
    box-shadow: 0 0 22px color-mix(in srgb, var(--bot-border) 25%, transparent), inset 0 0 20px color-mix(in srgb, var(--bot-border) 6%, transparent);
  }
  .meta { display: flex; gap: 10px; align-items: center; margin-top: 5px; font-size: 10px; color: var(--dim); padding: 0 6px; font-family: 'Orbitron', monospace; letter-spacing: 1px; }
  .meta button { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 12px; padding: 3px 6px; border-radius: 4px; transition: all .15s; }
  .meta button:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 20%, transparent); }
  .msg.user .meta { flex-direction: row-reverse; }
  .sys-note { align-self: center; font-size: 10px; color: var(--dim); background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.09); padding: 5px 16px; border-radius: 30px; font-family: 'Orbitron', monospace; letter-spacing: 1px; }

  /* typing — core charging */
  .typing { align-self: flex-start; display: none; align-items: center; gap: 7px; padding: 14px 20px; border-radius: 6px; background: linear-gradient(135deg, var(--bot-grad1), var(--bot-grad2)); border: 1px solid var(--bot-border); clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
  .typing span { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-6px); opacity: 1; } }

  /* ===== Input bar ===== */
  .inputbar {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, rgba(8,16,36,.9), rgba(5,10,26,.6));
    backdrop-filter: blur(20px);
    border-top: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    position: relative;
  }
  .inputbar::before { content: ''; position: absolute; top: -1px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: .6; }
  #inp {
    flex: 1; min-height: 46px; max-height: 130px; resize: none; border-radius: 6px;
    background: rgba(0,229,255,.05); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    color: var(--txt); font-size: 15px; padding: 12px 15px; outline: none; font-family: 'Prompt', sans-serif; font-weight: 300; line-height: 1.4;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    transition: box-shadow .2s, border-color .2s;
  }
  #inp:focus { border-color: var(--accent); box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 30%, transparent), inset 0 0 16px color-mix(in srgb, var(--accent) 6%, transparent); }
  #inp::placeholder { color: rgba(232,246,255,.3); }
  .send {
    width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer; flex: none;
    font-size: 20px; color: #02101a; font-family: 'Orbitron', sans-serif; font-weight: 900;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 40%, var(--purple)));
    position: relative; overflow: visible;
    box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 55%, transparent);
    transition: transform .15s, box-shadow .15s;
  }
  .send::before { content: ''; position: absolute; inset: -5px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); animation: spin 4s linear infinite; }
  .send:active { transform: scale(.85); box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 90%, transparent); }
  .send:disabled { opacity: .4; }

  /* Theme pop */
  .theme-pop {
    position: fixed; bottom: 92px; right: 14px; z-index: 30; display: none; flex-direction: column; gap: 10px;
    background: rgba(8,16,36,.94); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    border-radius: 8px; padding: 14px; backdrop-filter: blur(20px);
    box-shadow: 0 14px 50px rgba(0,0,0,.7), 0 0 24px color-mix(in srgb, var(--accent) 15%, transparent);
  }
  .theme-pop.show { display: flex; }
  .theme-pop .ttl { font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }
  .theme-row { display: flex; gap: 9px; }
  .swatch { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; position: relative; transition: transform .15s; }
  .swatch:hover { transform: scale(1.15); }
  .swatch.on { border-color: #fff; box-shadow: 0 0 16px rgba(255,255,255,.4); }

  #toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-90px); z-index: 60;
    background: rgba(8,16,36,.95); border: 1px solid var(--accent); color: var(--txt);
    padding: 11px 22px; border-radius: 6px; font-size: 12px; transition: transform .3s; pointer-events: none;
    font-family: 'Orbitron', monospace; letter-spacing: 1px;
    box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 25%, transparent);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="bgfx">
  <div class="aurora a1"></div><div class="aurora a2"></div>
  <div class="scanlines"></div><div class="vignette"></div>
</div>
<canvas id="particles"></canvas>

<div class="app">
  <header>
    <button class="back-btn" id="backBtn" title="กลับหน้าหลัก">←</button>
    <div class="avatar-wrap">
      <div class="ring"></div>
      <div class="avatar" id="av">💜</div>
    </div>
    <div class="hinfo">
      <h1 id="rname">SLI</h1>
      <div class="status"><span class="pulse"></span><span id="rtag">ผู้ช่วยส่วนตัว · ONLINE</span></div>
    </div>
    <div class="hbtns">
      <button class="icon-btn" id="themeBtn" title="เปลี่ยนธีม">🎨</button>
      <button class="icon-btn" id="clearBtn" title="ล้างแชท">🗑</button>
    </div>
  </header>

  <div id="msgs"></div>
  <div class="typing" id="typing"><span></span><span></span><span></span></div>

  <div class="inputbar">
    <textarea id="inp" rows="1" placeholder="พิมพ์ข้อความ..." enterkeyhint="send"></textarea>
    <button class="send" id="sendBtn" title="ส่ง">➤</button>
  </div>
</div>

<div class="theme-pop" id="themePop">
  <div class="ttl">▣ ACCENT COLOR</div>
  <div class="theme-row">
    <div class="swatch on" data-accent="#00e5ff" style="background:linear-gradient(135deg,#00e5ff,#00b0ff)"></div>
    <div class="swatch" data-accent="#a78bfa" style="background:linear-gradient(135deg,#a78bfa,#d500f9)"></div>
    <div class="swatch" data-accent="#ffb74d" style="background:linear-gradient(135deg,#ffb74d,#ff6d00)"></div>
    <div class="swatch" data-accent="#ff2d95" style="background:linear-gradient(135deg,#ff2d95,#d500f9)"></div>
    <div class="swatch" data-accent="#22e584" style="background:linear-gradient(135deg,#22e584,#00b8a9)"></div>
  </div>
</div>
<div id="toast"></div>

<script>
  /* ===== ห้อง ===== */
  const ROOMS = {
    private: { name: 'SLI', tag: 'ผู้ช่วยส่วนตัว · ONLINE', avatar: '💜', accent: '#a78bfa' },
    work:    { name: 'WORK', tag: 'ผู้ช่วยทำงาน · ONLINE', avatar: '💼', accent: '#00e5ff' },
    lab:     { name: 'LAB', tag: 'นักประดิษฐ์ & นักทดลอง · ONLINE', avatar: '🔬', accent: '#ffb74d' }
  };
  const room = new URLSearchParams(location.search).get('room') || 'private';
  const R = ROOMS[room] || ROOMS.private;
  document.documentElement.style.setProperty('--accent', R.accent);
  const botC = R.accent;
  document.documentElement.style.setProperty('--bot-grad1', botC + '33');
  document.documentElement.style.setProperty('--bot-grad2', botC + '14');
  document.documentElement.style.setProperty('--bot-border', botC + '73');
  document.getElementById('av').textContent = R.avatar;
  document.getElementById('rname').textContent = R.name;
  document.getElementById('rtag').textContent = R.tag;
  document.title = R.name + ' — SILELO Neo-Connect';

  /* ===== ประวัติ (localStorage ต่อห้อง) ===== */
  const KEY = 'nc_' + room;
  let history = [];
  try { history = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { history = []; }

  const msgsEl = document.getElementById('msgs');
  const fmt = (t) => new Date(t).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  function addMsg(role, content, t) {
    const m = { role, content, t: t || Date.now() };
    history.push(m); if (history.length > 200) history = history.slice(-200);
    try { localStorage.setItem(KEY, JSON.stringify(history)); } catch (e) {}
    renderMsg(m);
    return m;
  }
  function renderMsg(m) {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.role === 'assistant' ? 'bot' : 'user');
    div.innerHTML = `
      <div class="bubble"></div>
      <div class="meta">
        <span>${fmt(m.t)}</span>
        ${m.role === 'assistant' ? '<button class="spk" title="ฟังเสียง">🔊</button><button class="cpy" title="คัดลอก">📋</button>' : '<span>★ READ</span>'}
      </div>`;
    div.querySelector('.bubble').textContent = m.content;
    const spk = div.querySelector('.spk');
    if (spk) spk.onclick = () => speak(m.content);
    const cpy = div.querySelector('.cpy');
    if (cpy) cpy.onclick = () => { navigator.clipboard.writeText(m.content).then(() => toast('📋 COPIED')); };
    msgsEl.appendChild(div);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }
  if (history.length) history.forEach(renderMsg);
  else {
    const hellos = {
      private: 'สวัสดีพี่นุค่ะ 💜 สลี่อยู่ตรงนี้แล้ว — พี่อยากคุยอะไร วันนี้เป็นยังไงบ้างคะ?',
      work: 'พร้อมทำงานครับ 💼 — มีงานอะไรให้ผมจัดการ บอกมาได้เลย (วางแผน, โค้ด, สรุป, วิเคราะห์)',
      lab: 'ยินดีต้อนรับสู่ห้องแล็บ! 🔬 วันนี้เราจะทดลองอะไรกันดี — ตั้งคำถามมาได้เลยครับ!'
    };
    addMsg('assistant', hellos[room] || hellos.private);
  }

  /* ===== ส่งข้อความ ===== */
  const inp = document.getElementById('inp');
  const sendBtn = document.getElementById('sendBtn');
  const typing = document.getElementById('typing');
  function autoGrow() { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 130) + 'px'; }
  inp.addEventListener('input', autoGrow);

  async function send() {
    const q = inp.value.trim();
    if (!q) return;
    addMsg('user', q);
    inp.value = ''; autoGrow();
    typing.style.display = 'flex';
    sendBtn.disabled = true;
    msgsEl.scrollTop = msgsEl.scrollHeight;
    try {
      const r = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ room, question: q, history: history.slice(-12, -1) })
      });
      const j = await r.json();
      if (j.reply) { addMsg('assistant', j.reply); toast('⚡ ' + (j.provider === 'mock' ? 'BACKUP MODE' : j.provider.toUpperCase() + ' · ' + j.model)); }
      else toast('⚠ ' + (j.error || 'NO REPLY'));
    } catch (e) { toast('⚠ SERVER UNREACHABLE'); }
    typing.style.display = 'none';
    sendBtn.disabled = false;
  }
  sendBtn.onclick = send;
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

  /* ===== TTS ===== */
  let audio = null;
  async function speak(text) {
    if (!text) return;
    toast('🔊 SYNTHESIZING...');
    try {
      const r = await fetch('/api/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text.slice(0, 240) }) });
      if (!r.ok) throw new Error();
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      if (audio) { audio.pause(); audio = null; }
      audio = new Audio(url);
      audio.onended = () => toast('🔊 DONE');
      audio.play();
      toast('🔊 PLAYING');
    } catch (e) { toast('⚠ TTS OFFLINE'); }
  }

  /* ===== ปุ่มอื่นๆ ===== */
  document.getElementById('backBtn').onclick = () => location.href = '/';
  document.getElementById('clearBtn').onclick = () => {
    if (confirm('ล้างประวัติแชทห้องนี้ทั้งหมด?')) {
      history = []; try { localStorage.removeItem(KEY); } catch (e) {}
      msgsEl.innerHTML = '';
      addMsg('assistant', R.name + ': MEMORY WIPED — ห้องสะอาดพร้อมเริ่มใหม่ 🧹');
    }
  };

  const themePop = document.getElementById('themePop');
  document.getElementById('themeBtn').onclick = () => themePop.classList.toggle('show');
  document.querySelectorAll('.swatch').forEach(s => {
    s.onclick = () => {
      const c = s.dataset.accent;
      document.documentElement.style.setProperty('--accent', c);
      document.documentElement.style.setProperty('--bot-grad1', c + '33');
      document.documentElement.style.setProperty('--bot-grad2', c + '14');
      document.documentElement.style.setProperty('--bot-border', c + '73');
      document.querySelectorAll('.swatch').forEach(x => x.classList.remove('on'));
      s.classList.add('on');
      try { localStorage.setItem('nc_theme', c); } catch (e) {}
      toast('🎨 ACCENT: ' + c.toUpperCase());
      themePop.classList.remove('show');
    };
  });
  try {
    const saved = localStorage.getItem('nc_theme');
    if (saved) {
      document.documentElement.style.setProperty('--accent', saved);
      document.documentElement.style.setProperty('--bot-grad1', saved + '33');
      document.documentElement.style.setProperty('--bot-grad2', saved + '14');
      document.documentElement.style.setProperty('--bot-border', saved + '73');
      document.querySelectorAll('.swatch').forEach(x => x.classList.toggle('on', x.dataset.accent === saved));
    }
  } catch (e) {}

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ===== อนุภาค ===== */
  const cv = document.getElementById('particles'), ctx = cv.getContext('2d');
  let W, H, parts = [];
  const N = Math.min(60, Math.floor(innerWidth * innerHeight / 22000));
  function resize() {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    parts = Array.from({ length: N }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3, r: Math.random() * 1.6 + .5, a: Math.random() * .4 + .2 }));
  }
  resize(); addEventListener('resize', resize);
  (function loop() {
    ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7);
      ctx.fillStyle = `rgba(0,229,255,${p.a})`; ctx.fill();
    }
    for (let i = 0; i < parts.length; i++) for (let j = i + 1; j < parts.length; j++) {
      const dx = parts[i].x - parts[j].x, dy = parts[i].y - parts[j].y;
      const d = Math.hypot(dx, dy);
      if (d < 110) {
        ctx.beginPath(); ctx.moveTo(parts[i].x, parts[i].y); ctx.lineTo(parts[j].x, parts[j].y);
        ctx.strokeStyle = `rgba(0,229,255,${(1 - d / 110) * .14})`; ctx.lineWidth = 1; ctx.stroke();
      }
    }
    requestAnimationFrame(loop);
  })();

  /* ===== Heartbeat ===== */
  setInterval(() => { try { fetch('/api/presence', { method: 'POST' }); } catch (e) {} }, 20000);
  try { fetch('/api/presence', { method: 'POST' }); } catch (e) {}

  inp.focus();
</script>
